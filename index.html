<!DOCTYPE html>
<html lang="id">

<head>
  <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no'
    name='viewport' />
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Happy Eid Mubarak</title>
  <meta name="description" content="Happy Eid Mubarak">
  <meta property="og:title" content="Happy Eid Mubarak" />
  <meta property="og:description" content="Happy Eid Mubarak">
  <link rel="shortcut icon" type="image/x-icon" href="Card-Logo.png">
  <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ======================== */
    /* REFINED STYLES */
    /* ======================== */
    
    :root {
      --primary: #01787E;
      --secondary: #f96c4c;
      --light-bg: #fcebe7;
      --card-bg: #ffffff;
      --text-dark: #2d3436;
      --text-light: #666666;
      --gold: #d4a574;
      --salmon: #fa8072;
    }

    * {
      transition: all 0.3s ease;
    }

    body {
      min-height: 100vh;
      min-width: 100vw;
      background: var(--light-bg);
      position: relative;
      font-family: "Josefin Sans", sans-serif;
      color: var(--primary);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* ======================== */
    /* MAIN CARD WRAPPER */
    /* ======================== */

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ======================== */
    /* CARD HEADER / TOP SECTION */
    /* ======================== */

    .wrapper h2 {
      display: block;
      text-align: center;
      padding: 1.5rem 1rem 0.5rem;
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
      animation: fadeInDown 0.8s ease-out 0.2s both;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wrapper h2 span {
      display: block;
      font-size: 0.5em;
      letter-spacing: 2px;
      font-weight: 400;
      margin-top: 0.5rem;
      color: var(--text-light);
      font-style: italic;
    }

    /* ======================== */
    /* MAIN CONTENT */
    /* ======================== */

    .wrapper p {
      padding: 1rem 1.2rem;
      margin: 0;
      line-height: 1.8;
      font-size: 0.95rem;
      text-align: center;
      color: var(--text-dark);
      animation: fadeIn 0.8s ease-out 0.4s both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .wrapper p br {
      display: block;
      content: "";
      margin: 0.5rem 0;
    }

    /* Arabic Dua */
    .wrapper p:nth-of-type(1) {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--primary);
      padding-top: 1.5rem;
      padding-bottom: 0.5rem;
    }

    .wrapper p:nth-of-type(1) br:first-of-type {
      margin-bottom: 0.8rem;
    }

    /* Decorative line */
    .wrapper p:after {
      content: "";
      display: block;
      width: 80%;
      margin: 0.8rem auto 0;
      border-bottom: 1px dashed var(--gold);
      opacity: 0.6;
    }

    /* Send button in paragraph */
    .wrapper p a {
      display: inline-block;
      margin-left: 0.3rem;
      margin-top: 0.5rem;
      padding: 0.4rem 0.8rem;
      background: var(--secondary);
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(249, 108, 76, 0.3);
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    .wrapper p a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(249, 108, 76, 0.4);
    }

    .wrapper p a:active {
      transform: translateY(0);
    }

    /* ======================== */
    /* SLEEVE (BOTTOM SECTION) */
    /* ======================== */

    .sleeve {
      position: relative;
      width: 100%;
      height: 280px;
      background: var(--salmon);
      background: linear-gradient(135deg, #fa8072 0%, #ff6b6b 100%);
      border-radius: 0 0 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center;
      animation: fadeInUp 0.8s ease-out 0.5s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wrapper:hover .sleeve {
      transform: scale(1.02) rotate(-2deg);
    }

    .wrapper:active .sleeve {
      transform: scale(0.98);
    }

    .sleeve:before {
      content: "";
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      height: 20px;
      background: var(--card-bg);
      border-radius: 100% 100% 0 0;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* Sleeve label */
    .sleeve h2 {
      position: relative;
      z-index: 2;
      color: white;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      animation: fadeIn 0.8s ease-out 0.6s both;
    }

    /* Circle (decorative) */
    .circle {
      position: relative;
      z-index: 2;
      width: 140px;
      height: 140px;
      background: rgba(255, 255, 255, 0.15);
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      animation: fadeIn 0.8s ease-out 0.7s both;
    }

    /* Card logo image */
    .dsa {
      position: relative;
      z-index: 3;
      max-width: 110px;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
      animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s both;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Hijri year */
    .gsas {
      position: absolute;
      bottom: 15px;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      animation: fadeIn 0.8s ease-out 0.9s both;
    }

    /* ======================== */
    /* RESPONSIVE DESIGN */
    /* ======================== */

    @media (max-width: 480px) {
      .wrapper {
        max-width: 100%;
        border-radius: 12px;
      }

      .wrapper h2 {
        padding: 1.25rem 0.75rem 0.5rem;
        font-size: 1.2rem;
      }

      .wrapper h2 span {
        font-size: 0.45em;
        margin-top: 0.3rem;
      }

      .wrapper p {
        padding: 0.8rem 1rem;
        font-size: 0.9rem;
      }

      .wrapper p:nth-of-type(1) {
        font-size: 1rem;
        padding-top: 1.2rem;
      }

      .sleeve {
        height: 240px;
        border-radius: 0 0 12px 12px;
      }

      .sleeve h2 {
        font-size: 1rem;
        margin-bottom: 0.3rem;
      }

      .circle {
        width: 120px;
        height: 120px;
      }

      .dsa {
        max-width: 95px;
      }

      .gsas {
        font-size: 0.85rem;
        bottom: 12px;
      }
    }

    @media (max-width: 360px) {
      .wrapper h2 {
        font-size: 1.1rem;
      }

      .wrapper p {
        font-size: 0.85rem;
        padding: 0.75rem;
      }

      .sleeve {
        height: 220px;
      }

      .circle {
        width: 100px;
        height: 100px;
        margin-bottom: 0.3rem;
      }

      .dsa {
        max-width: 85px;
      }

      .wrapper p a {
        padding: 0.3rem 0.6rem;
        font-size: 0.75rem;
      }
    }

    /* ======================== */
    /* TIME DISPLAY */
    /* ======================== */

    #jam {
      font-size: 0.6em;
      font-weight: 400;
      color: var(--text-light);
      margin-left: 0.5rem;
    }

    /* ======================== */
    /* BUTTON (UNUSED - HIDDEN) */
    /* ======================== */

    .butn {
      display: none;
    }

    button {
      outline: none;
      border: none;
      font-size: 18px;
      text-transform: uppercase;
      margin: auto;
      cursor: pointer;
      letter-spacing: 2px;
      color: #fff;
    }

    /* ======================== */
    /* INNER ELEMENT (HIDDEN) */
    /* ======================== */

    .inner {
      display: none;
    }

    /* ======================== */
    /* ANIMATIONS - STAGGERED */
    /* ======================== */

    @keyframes fadeInHeavy {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <!-- Main Card -->
  <div class="wrapper">
    <!-- Header -->
    <h2 style="color: var(--primary);">
      Happy Eid Mubarak ✨
      <span id="jam">Loading...</span>
    </h2>

    <!-- Content -->
    <p>
      <br>تَقَبَّلَ اللَّهُ مِنَّا وَمِنْكُمْ كُلُّ عاَمٍ وَأَنْتُمْ بِخَيْرٍ
      <br>
      <br>Maafkan Bayu 🙏
      <br>Jika ada salah, baik yang disengaja maupun tidak
      <br>
      <a href="THR.html">Minta THR 💚</a>
    </p>

    <!-- Sleeve (Bottom Section) -->
    <div class="sleeve">
      <h2>Tap Here</h2>
      <div class="circle"></div>
      <img src="Card-Logo.png" class="dsa" alt="Card Logo">
      <h2 class="gsas">1447 H</h2>
    </div>
  </div>

  <!-- Hidden Elements (kept for compatibility) -->
  <div class="butn" style="display: none;">
    <button>
      <span></span>
    </button>
  </div>

  <!-- Scripts -->
  <script>
    // Display Jakarta time
    setInterval(() => {
      const jamna = new Date().toLocaleTimeString('id-ID', {
        timeZone: "Asia/Jakarta",
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById("jam").innerHTML = jamna;
    }, 1000);

    // Add click interaction to sleeve
    document.querySelector('.sleeve').addEventListener('click', function () {
      // Optional: Add visual feedback or navigate
      this.style.transform = 'scale(0.98) rotate(-2deg)';
      setTimeout(() => {
        this.style.transform = '';
      }, 150);
    });
  </script>
</body>

</html>
